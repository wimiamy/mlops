collect:
  version: "v1"
  n_rows: 7000
  sources:
    v1:
      - "datasets/financial-qa-10K/data/train-00000-of-00001.parquet"
    v2:
      - "datasets/financial-qa-10K/data/0.1-00000-of-00001.parquet"
  topics: null
  verify_answer_index: false
  system_prompts:
    - "You are a financial assistant..."
    - "You are an expert in financial analysis..."
    - "You are a helpful assistant for financial questions..."
    - "You are a finance expert answering questions about company filings..."
    - "You are an AI assistant specialized in 10-K financial reports..."

clean:
  min_question_len: 30
  min_answer_len: 2
  near_dup_threshold: 0.85
  pii_patterns:
    phone: "\\b\\d{3}[-.]?\\d{3}[-.]?\\d{4}\\b"
    email: "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,}\\b"
    birth_date: "\\b(0[1-9]|1[0-2])[/-](0[1-9]|[12]\\d|3[01])[/-](19|20)\\d{2}\\b"

diversity:
  min_groups: 50
  min_system_prompts: 3
  min_answer_len_ratio: 1.6

split:
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  group_key: "ticker"
  seed: 42

contamination:
  check_id_overlap: true
  check_text_overlap: true
  check_group_overlap: true
  near_dup_threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
